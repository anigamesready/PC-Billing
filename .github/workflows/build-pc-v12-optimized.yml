name: Build AniGames PC V12.4.5 Admin Logout + Responsive Login

on:
  push:
    branches:
      - main
      - feature/dual-db-runtime-routing-v1
      - feature/v13-free-test-shutdown-timer
      - feature/v13-heartbeat-session-performance
      - feature/v13-app-exit-protection
      - feature/global-rental-pc-v12.3.4
      - feature/global-rental-pc-v12.3.5
      - feature/admin-pc-wol-relay-v12.3.6
      - fix/pc-v12.3.7-single-instance-guard
      - fix/pc-v12.3.9-kiosk-failsafe
      - fix/pc-v12.4.0-timer-window-stability
      - fix/pc-v12.4.1-lock-state-recovery
      - fix/pc-v12.4.2-watchdog-after-ready
      - release/pc-v12.4.4-admin-windows-controls
      - release/pc-v12.4.5-admin-logout-responsive-fit
    paths:
      - 'AniGames-PC-V12.1.0-ADMIN-POPUP-FIXED-SOURCE.zip'
      - 'scripts/patch_pc_log_optimization.py'
      - 'scripts/patch_pc_token_preservation.py'
      - 'scripts/patch_pc_live_alert_runtime.py'
      - 'scripts/patch_pc_dual_db_routing.py'
      - 'scripts/patch_pc_shared_gateway.py'
      - 'scripts/patch_pc_v12_2_3_route_refresh.py'
      - 'scripts/patch_pc_v13_shutdown_timer.py'
      - 'scripts/patch_pc_v13_free_test_gate.py'
      - 'scripts/patch_pc_v13_1_heartbeat_performance.py'
      - 'scripts/patch_pc_v13_2_app_exit_protection.py'
      - 'scripts/patch_pc_v13_3_resilience_watchdog.py'
      - 'scripts/patch_pc_v12_3_4_global_rentals.py'
      - 'scripts/patch_pc_v12_3_5_global_rental_gateway.py'
      - 'scripts/patch_pc_v12_3_6_wol_relay.py'
      - 'scripts/patch_pc_v12_3_7_single_instance.py'
      - 'scripts/patch_pc_v12_3_8_auto_wol_mac.py'
      - 'scripts/patch_pc_v12_3_9_kiosk_failsafe.py'
      - 'scripts/patch_pc_v12_4_0_timer_window_stability.py'
      - 'scripts/patch_pc_v12_4_1_lock_state_recovery.py'
      - 'scripts/patch_pc_v12_4_2_watchdog_after_ready.py'
      - 'scripts/patch_pc_v12_4_3_emergency_no_shutdown.py'
      - 'scripts/patch_pc_v12_4_4_restore_direct_windows_shutdown.py'
      - 'scripts/patch_pc_v12_4_5_admin_logout_responsive_login.py'
      - 'supabase/migrations/20261101090000_secure_wol_target_mac_resolution.sql'
      - 'supabase/migrations/20261027120000_free_test_policy_and_server_gate.sql'
      - 'supabase/migrations/20261028120000_heartbeat_event_write_optimization.sql'
      - 'supabase/migrations/20261029130000_device_watchdog_restart_billing.sql'
      - 'supabase/migrations/20261029140000_offline_restart_command_gate.sql'
      - 'supabase/migrations/20261030100000_global_rental_accounts_and_offline_leases.sql'
      - 'supabase/functions/ani-games-api/index.ts'
      - 'supabase/functions/ani-games-api/deno.json'
      - 'docs/PC-LOG-OPTIMIZATION-AUDIT.md'
      - 'docs/PC-HEARTBEAT-SESSION-PERFORMANCE-AUDIT.md'
      - 'docs/PC-SINGLE-INSTANCE-AUDIT-V12.3.7.md'
      - 'docs/PC-KIOSK-FAILSAFE-AUDIT-V12.3.9.md'
      - 'docs/PC-TIMER-WINDOW-STABILITY-V12.4.0.md'
      - 'docs/PC-LOCK-STATE-RECOVERY-V12.4.1.md'
      - 'docs/PC-WATCHDOG-AFTER-READY-V12.4.2.md'
      - '.github/workflows/build-pc-v12-optimized.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pc:
    name: Patch, test, and build Windows portable EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: pwsh
        run: |
          $zip = 'AniGames-PC-V12.1.0-ADMIN-POPUP-FIXED-SOURCE.zip'
          if (!(Test-Path $zip)) { throw 'PC Billing source ZIP missing.' }
          Expand-Archive -LiteralPath $zip -DestinationPath 'source-bundle' -Force
          $project = Get-ChildItem 'source-bundle' -Directory -Recurse | Where-Object { $_.Name -eq 'Ani-Games-Billing-PC-V12.1.0' } | Select-Object -First 1
          if (!$project) { throw 'Ani-Games-Billing-PC-V12.1.0 folder not found in source ZIP.' }
          if (!(Test-Path (Join-Path $project.FullName 'renderer.js'))) { throw 'PC renderer.js missing.' }
          $edgeTarget = Join-Path $project.FullName 'supabase/functions/ani-games-api'
          New-Item -ItemType Directory -Path $edgeTarget -Force | Out-Null
          Copy-Item 'supabase/functions/ani-games-api/index.ts' (Join-Path $edgeTarget 'index.ts') -Force
          Copy-Item 'supabase/functions/ani-games-api/deno.json' (Join-Path $edgeTarget 'deno.json') -Force
          Copy-Item 'scripts/patch_pc_log_optimization.py' (Join-Path $project.FullName 'patch_pc_log_optimization.py')
          Copy-Item 'scripts/patch_pc_token_preservation.py' (Join-Path $project.FullName 'patch_pc_token_preservation.py')
          Copy-Item 'scripts/patch_pc_live_alert_runtime.py' (Join-Path $project.FullName 'patch_pc_live_alert_runtime.py')
          Copy-Item 'scripts/patch_pc_dual_db_routing.py' (Join-Path $project.FullName 'patch_pc_dual_db_routing.py')
          Copy-Item 'scripts/patch_pc_shared_gateway.py' (Join-Path $project.FullName 'patch_pc_shared_gateway.py')
          Copy-Item 'scripts/patch_pc_v12_2_3_route_refresh.py' (Join-Path $project.FullName 'patch_pc_v12_2_3_route_refresh.py')
          Copy-Item 'scripts/patch_pc_v13_shutdown_timer.py' (Join-Path $project.FullName 'patch_pc_v13_shutdown_timer.py')
          Copy-Item 'scripts/patch_pc_v13_free_test_gate.py' (Join-Path $project.FullName 'patch_pc_v13_free_test_gate.py')
          Copy-Item 'scripts/patch_pc_v13_1_heartbeat_performance.py' (Join-Path $project.FullName 'patch_pc_v13_1_heartbeat_performance.py')
          Copy-Item 'scripts/patch_pc_v13_2_app_exit_protection.py' (Join-Path $project.FullName 'patch_pc_v13_2_app_exit_protection.py')
          Copy-Item 'scripts/patch_pc_v13_3_resilience_watchdog.py' (Join-Path $project.FullName 'patch_pc_v13_3_resilience_watchdog.py')
          Copy-Item 'scripts/patch_pc_v12_3_4_global_rentals.py' (Join-Path $project.FullName 'patch_pc_v12_3_4_global_rentals.py')
          Copy-Item 'scripts/patch_pc_v12_3_5_global_rental_gateway.py' (Join-Path $project.FullName 'patch_pc_v12_3_5_global_rental_gateway.py')
          Copy-Item 'scripts/patch_pc_v12_3_6_wol_relay.py' (Join-Path $project.FullName 'patch_pc_v12_3_6_wol_relay.py')
          Copy-Item 'scripts/patch_pc_v12_3_7_single_instance.py' (Join-Path $project.FullName 'patch_pc_v12_3_7_single_instance.py')
          Copy-Item 'scripts/patch_pc_v12_3_8_auto_wol_mac.py' (Join-Path $project.FullName 'patch_pc_v12_3_8_auto_wol_mac.py')
          Copy-Item 'scripts/patch_pc_v12_3_9_kiosk_failsafe.py' (Join-Path $project.FullName 'patch_pc_v12_3_9_kiosk_failsafe.py')
          Copy-Item 'scripts/patch_pc_v12_4_0_timer_window_stability.py' (Join-Path $project.FullName 'patch_pc_v12_4_0_timer_window_stability.py')
          Copy-Item 'scripts/patch_pc_v12_4_1_lock_state_recovery.py' (Join-Path $project.FullName 'patch_pc_v12_4_1_lock_state_recovery.py')
          Copy-Item 'scripts/patch_pc_v12_4_2_watchdog_after_ready.py' (Join-Path $project.FullName 'patch_pc_v12_4_2_watchdog_after_ready.py')
          Copy-Item 'scripts/patch_pc_v12_4_3_emergency_no_shutdown.py' (Join-Path $project.FullName 'patch_pc_v12_4_3_emergency_no_shutdown.py')
          Copy-Item 'scripts/patch_pc_v12_4_4_restore_direct_windows_shutdown.py' (Join-Path $project.FullName 'patch_pc_v12_4_4_restore_direct_windows_shutdown.py')
          Copy-Item 'scripts/patch_pc_v12_4_5_admin_logout_responsive_login.py' (Join-Path $project.FullName 'patch_pc_v12_4_5_admin_logout_responsive_login.py')
          New-Item -ItemType Directory -Path (Join-Path $project.FullName 'supabase/migrations') -Force | Out-Null
          Copy-Item 'supabase/migrations/20261027120000_free_test_policy_and_server_gate.sql' (Join-Path $project.FullName 'supabase/migrations/20261027120000_free_test_policy_and_server_gate.sql') -Force
          Copy-Item 'supabase/migrations/20261028120000_heartbeat_event_write_optimization.sql' (Join-Path $project.FullName 'supabase/migrations/20261028120000_heartbeat_event_write_optimization.sql') -Force
          Copy-Item 'supabase/migrations/20261029130000_device_watchdog_restart_billing.sql' (Join-Path $project.FullName 'supabase/migrations/20261029130000_device_watchdog_restart_billing.sql') -Force
          Copy-Item 'supabase/migrations/20261029140000_offline_restart_command_gate.sql' (Join-Path $project.FullName 'supabase/migrations/20261029140000_offline_restart_command_gate.sql') -Force
          Copy-Item 'supabase/migrations/20261030100000_global_rental_accounts_and_offline_leases.sql' (Join-Path $project.FullName 'supabase/migrations/20261030100000_global_rental_accounts_and_offline_leases.sql') -Force
          Copy-Item 'supabase/migrations/20261101090000_secure_wol_target_mac_resolution.sql' (Join-Path $project.FullName 'supabase/migrations/20261101090000_secure_wol_target_mac_resolution.sql') -Force
          "PC_PROJECT_DIR=$($project.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Detected PC project: $($project.FullName)"

      - name: Apply log and alert patch
        shell: pwsh
        run: |
          Set-Location $env:PC_PROJECT_DIR
          python patch_pc_log_optimization.py
          if ($LASTEXITCODE -ne 0) { throw 'PC source patch failed.' }

      - name: Apply pairing-state safety patch
        shell: pwsh
        run: |
          Set-Location $env:PC_PROJECT_DIR
          python patch_pc_token_preservation.py
          if ($LASTEXITCODE -ne 0) { throw 'PC pairing-state safety patch failed.' }

      - name: Patch live index.html alert runtime
        shell: pwsh
        run: |
          Set-Location $env:PC_PROJECT_DIR
          python patch_pc_live_alert_runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'Live index.html alert patch failed.' }

      - name: Apply guarded dual-DB runtime routing patch
        shell: pwsh
        run: |
          Set-Location $env:PC_PROJECT_DIR
          python patch_pc_dual_db_routing.py
          if ($LASTEXITCODE -ne 0) { throw 'PC dual-DB routing patch failed.' }
          python patch_pc_shared_gateway.py
          if ($LASTEXITCODE -ne 0) { throw 'PC shared gateway patch failed.' }
          python patch_pc_v12_2_3_route_refresh.py
          if ($LASTEXITCODE -ne 0) { throw 'PC V12.2.3 route refresh patch failed.' }
          python patch_pc_v13_shutdown_timer.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.3.0 target-bound shutdown timer patch failed.' }
          python patch_pc_v13_free_test_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.3.0 server-side FREE TEST gate patch failed.' }
          python patch_pc_v13_1_heartbeat_performance.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.3.1 heartbeat/session performance patch failed.' }
          python patch_pc_v13_2_app_exit_protection.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.3.2 app exit protection patch failed.' }
          python patch_pc_v13_3_resilience_watchdog.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.3.3 resilience/watchdog patch failed.' }
          python patch_pc_v12_3_4_global_rentals.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.3.4 global rental patch failed.' }
          python patch_pc_v12_3_5_global_rental_gateway.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.3.5 shared gateway version patch failed.' }
          python patch_pc_v12_3_6_wol_relay.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.3.6 Wake-on-LAN relay patch failed.' }
          python patch_pc_v12_3_7_single_instance.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.3.7 single-instance guard patch failed.' }
          python patch_pc_v12_3_8_auto_wol_mac.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.3.8 automatic wired LAN MAC heartbeat patch failed.' }
          python patch_pc_v12_3_9_kiosk_failsafe.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.3.9 kiosk fail-safe patch failed.' }
          python patch_pc_v12_4_0_timer_window_stability.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.4.0 timer-window stability patch failed.' }
          python patch_pc_v12_4_1_lock_state_recovery.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.4.1 lock-state recovery patch failed.' }
          python patch_pc_v12_4_2_watchdog_after_ready.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.4.2 watchdog-after-ready patch failed.' }
          python patch_pc_v12_4_3_emergency_no_shutdown.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.4.3 emergency shutdown removal patch failed.' }
          python patch_pc_v12_4_4_restore_direct_windows_shutdown.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.4.4 direct Admin Windows controls patch failed.' }
          python patch_pc_v12_4_5_admin_logout_responsive_login.py
          if ($LASTEXITCODE -ne 0) { throw 'V12.4.5 Admin Logout/responsive Login patch failed.' }

      - name: JavaScript and API static regression
        shell: pwsh
        run: |
          Set-Location $env:PC_PROJECT_DIR
          node --check main.js
          if ($LASTEXITCODE -ne 0) { throw 'main.js syntax check failed.' }
          node --check renderer.js
          if ($LASTEXITCODE -ne 0) { throw 'renderer.js syntax check failed.' }
          node --check v11-cloud.js
          if ($LASTEXITCODE -ne 0) { throw 'v11-cloud.js syntax check failed.' }
          node --check preload.js
          if ($LASTEXITCODE -ne 0) { throw 'preload.js syntax check failed.' }
          $renderer = Get-Content 'renderer.js' -Raw
          $index = Get-Content 'index.html' -Raw
          $cloud = Get-Content 'v11-cloud.js' -Raw
          $main = Get-Content 'main.js' -Raw
          $preload = Get-Content 'preload.js' -Raw
          $edge = Get-Content 'supabase/functions/ani-games-api/index.ts' -Raw
          $runtimeMatches = [regex]::Matches($index, '(?s)<script(?:\s[^>]*)?>(.*?)</script>')
          $runtimeMatch = $null
          foreach ($candidate in $runtimeMatches) {
            if ($candidate.Groups[1].Value.Contains('function pauseSession')) { $runtimeMatch = $candidate; break }
          }
          if (!$runtimeMatch) { throw 'Live index.html main runtime script was not found.' }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'index-runtime-check.js'), $runtimeMatch.Groups[1].Value, [System.Text.UTF8Encoding]::new($false))
          node --check index-runtime-check.js
          if ($LASTEXITCODE -ne 0) { throw 'Live index.html JavaScript syntax check failed.' }
          foreach ($token in @('dbRouteFinalizedActive', 'cutover_test_note', 'resolveDbRoute', 'db-route-status', 'data_parity_ready', 'routing_gateway_ready', 'last_parity_check_at', "String(b.switch_id||'')!==String(route.switch_id||'')", 'automatic failover is disabled')) {
            if (!$cloud.Contains($token)) { throw "Dual DB route regression token missing: $token" }
          }
          foreach ($token in @('emitRentalAdminAlert(eventType, message', 'dihentikan manual dari Admin Android.', 'emitRentalAdminAlert(eventType, message, {', 'renderer.js is not loaded by Electron.', 'last.count = (Number(last.count) || 1) + 1', "if (manual) writeSystemLog('Backup manual berhasil.');")) {
            if (!$index.Contains($token)) { throw "Live index.html notification token missing: $token" }
          }
          foreach ($token in @('last.count', 'Backup manual berhasil', 'v11EmitAdminAlert', 'session_expired', 'session_stopped', 'dihentikan manual dari Admin Android')) {
            if (!$renderer.Contains($token)) { throw "Renderer regression token missing: $token" }
          }
          foreach ($token in @('ALERT_OUTBOX_KEY', 'flushAdminAlerts', '/device/alert', 'billing_v11_token_rejected_hold', 'DATA LOKAL DIPERTAHANKAN', 'window.v11GetAdminAlertStatus', 'alertNextRetryAt', 'reply?.accepted!==true', 'V12.3.3-RESILIENT-OFFLINE-TEST-WATCHDOG', 'setInterval(()=>{syncNow();flushAdminAlerts();flushSessionOutbox()},30000')) {
            if (!$cloud.Contains($token)) { throw "Cloud alert token missing: $token" }
          }
          if (!$edge.Contains('device/alert') -or !$edge.Contains('device_emit_admin_alert')) { throw 'Edge Function alert route missing.' }
          if ($cloud.Contains('setInterval(()=>{syncNow();pullNow();flushAdminAlerts()},30000)')) { throw 'Redundant 30-second pull timer remains.' }
          $wolRuntimeMatches = [regex]::Matches($index, '(?s)<script(?:\s[^>]*)?>(.*?)</script>')
          $wolRuntimeMatch = $null
          foreach ($candidate in $wolRuntimeMatches) {
            if ($candidate.Groups[1].Value.Contains('function pauseSession')) { $wolRuntimeMatch = $candidate; break }
          }
          if (!$wolRuntimeMatch) { throw 'Live index.html main runtime missing for WOL syntax check.' }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'index-wol-runtime-check.js'), $wolRuntimeMatch.Groups[1].Value, [System.Text.UTF8Encoding]::new($false))
          node --check index-wol-runtime-check.js
          if ($LASTEXITCODE -ne 0) { throw 'Live index.html WOL runtime syntax check failed.' }
          Remove-Item 'index-wol-runtime-check.js' -Force
          if (!$main.Contains("ipcMain.handle('get-wol-network-info'") -or !$preload.Contains("getWolNetworkInfo: () => ipcRenderer.invoke('get-wol-network-info')") -or !$cloud.Contains('wolLanMac:wolNetworkInfo.lanMac') -or !$cloud.Contains('wolLanObservedAt')) { throw 'Automatic wired LAN MAC heartbeat pipeline is incomplete.' }
          if ($index.Contains('targetMac:mac')) { throw 'Old client-provided MAC WoL payload remains in the PC relay.' }
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($package.version -ne '12.4.5') { throw "Unexpected PC automatic WOL patched version: $($package.version)" }
          if ($package.build.appId -ne 'com.anigames.billing.v12test' -or $package.build.productName -ne 'AniGames Billing V12.3.3') { throw 'Persistent Electron appId/productName changed; refusing build.' }
          foreach ($token in @('resolveDbRoute(attempt>0)', 'auth_parity_optional===true', 'active route is not finalized on both projects', "Coordinated global route finalized: '+r.active_target+' epoch '+epoch+' switch '+switchId")) {
            if (!$cloud.Contains($token)) { throw "Global route regression token missing: $token" }
          }
          python -m py_compile patch_pc_log_optimization.py patch_pc_token_preservation.py patch_pc_live_alert_runtime.py patch_pc_dual_db_routing.py patch_pc_shared_gateway.py patch_pc_v12_2_3_route_refresh.py patch_pc_v13_shutdown_timer.py patch_pc_v13_free_test_gate.py patch_pc_v13_1_heartbeat_performance.py patch_pc_v13_2_app_exit_protection.py patch_pc_v13_3_resilience_watchdog.py patch_pc_v12_3_5_global_rental_gateway.py patch_pc_v12_3_6_wol_relay.py patch_pc_v12_3_7_single_instance.py patch_pc_v12_3_8_auto_wol_mac.py patch_pc_v12_3_9_kiosk_failsafe.py patch_pc_v12_4_0_timer_window_stability.py patch_pc_v12_4_1_lock_state_recovery.py patch_pc_v12_4_2_watchdog_after_ready.py patch_pc_v12_4_3_emergency_no_shutdown.py patch_pc_v12_4_4_restore_direct_windows_shutdown.py patch_pc_v12_4_5_admin_logout_responsive_login.py
          if ($LASTEXITCODE -ne 0) { throw 'Patch script syntax check failed.' }
          foreach ($token in @('V12.3.8-AUTO-WOL-LAN-MAC', '<span id="app-version-code">V12.4.5-ADMIN-LOGOUT-RESPONSIVE-LOGIN</span>', '__freeTestOfflineFallback', 'window.v11CheckFreeTestPermission', 'device/test-policy', 'device_free_test_policy', 'FREE_TEST_DISABLED', '082298316902', 'start_trial')) {
            if (!$index.Contains($token) -and !$cloud.Contains($token) -and !$edge.Contains($token)) { throw "V12.3.0 feature regression token missing: $token" }
          }
          foreach ($token in @('ANI_GAMES_V12_4_3_PURGE_LEGACY_SHUTDOWN_TIMER', 'SHUTDOWN_TIMER_DISABLED')) {
            if (!$index.Contains($token)) { throw "V12.4.4 timer-removal guard missing: $token" }
          }
          foreach ($token in @('ANI_GAMES_V12_4_3_CANCEL_PENDING_WINDOWS_SHUTDOWN', "shutdown.exe', ['/a']")) {
            if (!$main.Contains($token)) { throw "V12.4.4 legacy shutdown-cancel guard missing: $token" }
          }
          if ($main.Contains('ANI_GAMES_V12_4_3_BLOCK_SHUTDOWN_IPC') -or $index.Contains('ANI_GAMES_V12_4_3_BLOCK_SHUTDOWN')) { throw 'Old unconditional Shutdown denial remains.' }
          if ($main.Contains('SHUTDOWN_DISABLED') -or $index.Contains('SHUTDOWN_DISABLED')) { throw 'Direct Shutdown is still rejected by the V12.4.3 emergency guard.' }
          foreach ($token in @("ipcMain.handle('hide-billing'", "ipcMain.handle('show-billing'", 'screen.getDisplayMatching(w.getBounds())')) { if (!$main.Contains($token)) { throw "V12.4.5 main Logout/Login assertion missing: $token" } }
          foreach ($token in @('hideBilling: () => ipcRenderer.invoke', 'showBilling: () => ipcRenderer.invoke')) { if (!$preload.Contains($token)) { throw "V12.4.5 preload assertion missing: $token" } }
          foreach ($token in @('fitLoginBoxToViewport', 'ani_games_billing_ui_state', "if (cmd === 'logout')", "if (cmd === 'refresh')", 'V12.4.5-ADMIN-LOGOUT-RESPONSIVE-LOGIN')) { if (!$index.Contains($token)) { throw "V12.4.5 responsive-login assertion missing: $token" } }
          if (!$cloud.Contains('billingUiState:String(localStorage.getItem')) { throw 'Billing UI visibility state is missing from cloud heartbeat.' }
          if (!$main.Contains("const powerCommands = { logoff: ['/l'], restart: ['/r', '/t', '0'], shutdown: ['/s', '/t', '0'] }") -or !$main.Contains("execFile('shutdown.exe', args")) { throw 'Direct Windows power-action whitelist/executor missing.' }
          if (!$index.Contains("if (cmd === 'schedule_shutdown')") -or !$index.Contains('SHUTDOWN_TIMER_DISABLED')) { throw 'Scheduled shutdown countdown must remain disabled.' }
          foreach ($token in @('function v12CheckScheduledShutdown()', 'function v12ShutdownScheduleFromAdmin(', 'function v12CancelScheduledShutdown(', 'window.__v12ShutdownTimerInterval', 'V12_SHUTDOWN_TIMER_KEY')) {
            if ($index.Contains($token)) { throw "Legacy shutdown countdown runtime remains: $token" }
          }
          if ($cloud.Contains('shutdownTimer:window.v11GetShutdownTimerStatus?.()||null')) { throw 'Shutdown timer heartbeat metadata is still being published.' }
          if (!$index.Contains('window.v11ApplyRemoteCommand = async (command, payload = {}) =>')) { throw 'Live Electron command dispatcher was not found.' }
          if (!$main.Contains("ipcMain.handle('wake-on-lan'") -or !$preload.Contains("wakeOnLan: (payload = {}) => ipcRenderer.invoke('wake-on-lan'") -or !$index.Contains("if (cmd === 'wake')") -or !$index.Contains('WAKE_COMMAND_EXPIRED')) { throw 'PC WOL relay IPC/identity/expiry guards are missing.' }
          if (!$index.Contains('WAKE_RELAY_IDENTITY_MISMATCH') -or !$index.Contains('wake-on-lan-magic-packet')) { throw 'PC relay identity or WOL acknowledgement fields are missing.' }
          foreach ($token in @('app.requestSingleInstanceLock({', "app.on('second-instance'", 'WATCHDOG_LOCK_PROFILE', 'DUPLICATE_BILLING_PROCESS', 'const dir = BILLING_USER_DATA_DIR;')) { if (!$main.Contains($token)) { throw "Single-instance guard missing: $token" } }
          if (!$main.Contains("app.setPath('userData', WATCHDOG_LOCK_PROFILE);")) { throw 'Separate watchdog lock profile is missing.' }
          if (!$edge.Contains('p==="device/test-policy"') -or !$edge.Contains('device_free_test_policy')) { throw 'Server FREE TEST policy endpoint is missing.' }
          foreach ($token in @('p==="device/rental/lookup"', 'p==="device/session/start"', 'p==="device/session/end"', 'p==="device/rental/release"', 'p==="device/sync-cursor"', 'device_rental_lookup', 'device_start_rental_session', 'device_end_rental_session')) { if (!$edge.Contains($token)) { throw "Global rental API route missing: $token" } }
          foreach ($token in @('V12.3.8-AUTO-WOL-LAN-MAC', 'v11StartRentalSession', 'v11LookupRentalCode', 'offlineLeaseValid', 'conflictSourceEventIds', 'localPendingActiveCode', 'flushSessionOutbox')) { if (!$cloud.Contains($token) -and !$index.Contains($token)) { throw "Global rental runtime token missing: $token" } }
          if ($cloud.Contains("request('/device/rentals'")) { throw 'Full rental snapshot API call remains enabled.' }
          $globalRentalMigration = Get-Content 'supabase/migrations/20261030100000_global_rental_accounts_and_offline_leases.sql' -Raw
          foreach ($token in @('admin_rental_accounts_global', 'admin_create_rental_global', 'admin_update_rental_global', 'admin_disable_rental_global', 'rental_offline_leases', 'rental_sessions_one_open_per_rental_account', 'rental_sync_conflicts', 'GLOBAL_RENTAL_HEARTBEAT_PATCH_ANCHOR_MISMATCH')) { if (!$globalRentalMigration.Contains($token)) { throw "Global rental SQL migration assertion missing: $token" } }
          $heartbeatMigration = Get-Content 'supabase/migrations/20261028120000_heartbeat_event_write_optimization.sql' -Raw
          foreach ($token in @('HEARTBEAT_EVENT_WRITE_OPTIMIZATION_V1', 'free_test_disabled', 'device_heartbeats', 'interval ''30 seconds''', 'interval ''60 seconds''')) { if (!$heartbeatMigration.Contains($token)) { throw "Heartbeat migration assertion missing: $token" } }
          foreach ($token in @('heartbeatInFlight=false', 'window.v11HeartbeatNow=', 'FREE TEST dinonaktifkan untuk sesi baru', 'const routeRetry=', 'err.retryable=routeRetry||')) { if (!$cloud.Contains($token)) { throw "V12.3.1 runtime assertion missing: $token" } }
          foreach ($token in @("protectedWindow.on('close'", "render-process-gone", "app.on('before-quit'", "app.on('query-session-end'", 'allowBillingExit = true;')) { if (!(Get-Content 'main.js' -Raw).Contains($token)) { throw "V12.3.2 close-protection assertion missing: $token" } }
          foreach ($token in @('V12.3.3-RESILIENT-OFFLINE-TEST-WATCHDOG', 'timer-health-pulse', 'syncWatchdogCredentials', 'safeStorage.encryptString', 'device/watchdog', 'FREE TEST berjalan lokal karena layanan Cloud tidak tersedia', 'FREE TEST dinonaktifkan untuk sesi baru', 'watchdog_app_ready')) { if (!$index.Contains($token) -and !$cloud.Contains($token) -and !$main.Contains($token) -and !$preload.Contains($token) -and !$edge.Contains($token)) { throw "V12.3.3 resilience assertion missing: $token" } }
          $offlineRestartMigration = Get-Content 'supabase/migrations/20261029140000_offline_restart_command_gate.sql' -Raw
          foreach ($token in @("p_command IS DISTINCT FROM 'restart_billing'", 'PC_OFFLINE_COMMAND_BLOCKED')) { if (!$offlineRestartMigration.Contains($token)) { throw "Offline restart command guard assertion missing: $token" } }
          $watchdogMigration = Get-Content 'supabase/migrations/20261029130000_device_watchdog_restart_billing.sql' -Raw
          foreach ($token in @('device_watchdog_poll', "c.command = 'restart_billing'", 'FOR UPDATE SKIP LOCKED')) { if (!$watchdogMigration.Contains($token)) { throw "Watchdog SQL assertion missing: $token" } }
          $failsafeTokens = @("globalShortcut.register('Control+Alt+F12'", 'function releaseDesktopLock(', "protectedWindow.webContents.on('did-fail-load'", "ipcMain.on('billing-renderer-ready'", 'Recovery limit reached')
          foreach ($token in $failsafeTokens) { if (!$main.Contains($token)) { throw "V12.3.9 kiosk fail-safe token missing: $token" } }
          foreach ($token in @('reportAppReady:', 'billing-renderer-ready')) { if (!$preload.Contains($token)) { throw "V12.3.9 preload bridge missing: $token" } }
          foreach ($token in @('reportAppReady?.({', 'functionsReady', 'domReady', 'V12.4.4-ADMIN-WINDOWS-CONTROLS')) { if (!$index.Contains($token)) { throw "V12.3.9 active renderer readiness token missing: $token" } }
          if (!$main.Contains('fullscreen: false,') -or !$main.Contains('kiosk: false,')) { throw 'V12.3.9 startup still locks kiosk before renderer readiness.' }
          $timerPositionFile = 'ani-games-timer-window-position.json'
          if (!$main.Contains($timerPositionFile) -or !$main.Contains('screen.getDisplayNearestPoint') -or !$main.Contains("protectedWindow.on('move'")) { throw 'V12.4.0 timer position persistence/display clamp is incomplete.' }
          $resizeStart = $main.IndexOf("ipcMain.on('resize-timer-window'")
          $resizeEnd = $main.IndexOf("ipcMain.on('minimize-timer-window'", $resizeStart)
          if ($resizeStart -lt 0 -or $resizeEnd -le $resizeStart) { throw 'V12.4.0 resize handler boundaries missing.' }
          if ($main.Substring($resizeStart, $resizeEnd - $resizeStart).Contains('.center()')) { throw 'V12.4.0 resize handler still recenters the timer.' }
          $activeStart = $main.IndexOf('function applyActiveTimerWindowMode')
          $activeEnd = $main.IndexOf('function releaseDesktopLock', $activeStart)
          if ($activeStart -lt 0 -or $activeEnd -le $activeStart -or $main.Substring($activeStart, $activeEnd - $activeStart).Contains('.center()')) { throw 'V12.4.0 active timer transition still recenters the window.' }
          if (!$index.Contains('lastTimerWindowSizeKey')) { throw 'V12.4.0 renderer size deduplication is missing.' }
          $recoveryStart = $main.IndexOf('function releaseDesktopLock')
          $recoveryEnd = $main.IndexOf('function armRendererReadyTimeout', $recoveryStart)
          if ($recoveryStart -lt 0 -or $recoveryEnd -le $recoveryStart) { throw 'V12.4.1 recovery function boundaries missing.' }
          $recoveryBody = $main.Substring($recoveryStart, $recoveryEnd - $recoveryStart)
          if ($recoveryBody.Contains('.minimize()') -or $recoveryBody.Contains('.center()')) { throw 'V12.4.1 fail-open path still hides or recenters Billing.' }
          if (!$main.Contains('rendererHealthySince') -or !$main.Contains('recoveryReloadInProgress')) { throw 'V12.4.1 recovery state guards missing.' }
          $readyStart = $main.IndexOf("ipcMain.on('billing-renderer-ready'")
          $readyEnd = $main.IndexOf("ipcMain.on('set-lock-mode'", $readyStart)
          if ($readyStart -lt 0 -or $readyEnd -le $readyStart -or $main.Substring($readyStart, $readyEnd - $readyStart).Contains('rendererRecoveryAttempts=0')) { throw 'V12.4.1 recovery budget is still reset at every renderer-ready event.' }
          if (!$main.Contains('Date.now()-rendererHealthySince>=60000')) { throw 'V12.4.1 stable-health recovery budget reset missing.' }
          if (!$main.Contains('rendererRecoveryPending)return')) { throw 'V12.4.1 duplicate recovery guard missing.' }
          $bootStart = $main.IndexOf('app.whenReady().then(async () => {')
          $bootEnd = $main.IndexOf('createWindow();', $bootStart)
          if ($bootStart -lt 0 -or $bootEnd -le $bootStart) { throw 'V12.4.4 startup boundary check failed.' }
          $bootBody = $main.Substring($bootStart, $bootEnd - $bootStart)
          if ($bootBody.Contains('launchWatchdogAgent()') -or $bootBody.Contains('billingTimerWatchdog=setInterval')) { throw 'V12.4.2 watchdog still starts before renderer READY.' }
          if (!$bootBody.Contains('await cancelPendingWindowsShutdownOnLaunch();')) { throw 'Legacy shutdown abort must execute before Billing window creation.' }
          if (!$main.Contains('function startBillingWatchdogsAfterReady()') -or !$main.Contains('startBillingWatchdogsAfterReady();') -or !$main.Contains('billingWatchdogsStarted=true')) { throw 'V12.4.2 READY-gated one-time watchdog start is missing.' }
          $readyAt = $main.IndexOf("ipcMain.on('billing-renderer-ready'")
          $readyUntil = $main.IndexOf("ipcMain.on('set-lock-mode'", $readyAt)
          if ($readyAt -lt 0 -or $readyUntil -le $readyAt -or $main.Substring($readyAt, $readyUntil - $readyAt).IndexOf('writeMainProcessState(true)') -gt $main.Substring($readyAt, $readyUntil - $readyAt).IndexOf('startBillingWatchdogsAfterReady();')) { throw 'V12.4.2 main READY state must be written before watchdog starts.' }
          if (!$bootBody.Contains("globalShortcut.register('Control+Alt+F12'")) { throw 'Emergency unlock shortcut must stay active during startup.' }
          Write-Host 'PASS: V12.4.2 detached + in-process watchdogs start once after live renderer READY; no watchdog interval/spawn during startup; emergency unlock remains active.'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ github.workspace }}/source-bundle/**/package-lock.json

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund
        working-directory: ${{ env.PC_PROJECT_DIR }}

      - name: Build Windows portable EXE
        shell: pwsh
        run: npm run build
        working-directory: ${{ env.PC_PROJECT_DIR }}

      - name: Verify and package outputs
        shell: pwsh
        run: |
          $exe = Get-ChildItem (Join-Path $env:PC_PROJECT_DIR 'dist') -Filter '*.exe' -File | Select-Object -First 1
          if (!$exe) { throw 'No portable EXE produced.' }
          $canonicalExePath = Join-Path $exe.DirectoryName 'AniGames Billing V12.4.5.exe'
          if ($exe.FullName -ne $canonicalExePath) {
            Move-Item -LiteralPath $exe.FullName -Destination $canonicalExePath -Force
            $exe = Get-Item -LiteralPath $canonicalExePath
          }
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
          @'
          import os, zipfile
          from pathlib import Path
          root = Path(os.environ["PC_PROJECT_DIR"]).resolve()
          output = Path("AniGames-PC-V12.4.5-ADMIN-LOGOUT-RESPONSIVE-LOGIN-SOURCE.zip")
          excluded = {"node_modules", "dist", ".git", ".cache", "__pycache__", "index-runtime-check.js"}
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for item in root.rglob("*"):
                  if not item.is_file() or any(part in excluded for part in item.relative_to(root).parts):
                      continue
                  zf.write(item, (Path(root.name) / item.relative_to(root)).as_posix())
          print(f"Source archive: {output} ({output.stat().st_size} bytes)")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Source archive packaging failed.' }
          Write-Host "Built EXE: $($exe.FullName)"

      - name: Upload EXE, patched source, and audit report
        uses: actions/upload-artifact@v4
        with:
          name: AniGames-PC-V12.4.5-ADMIN-LOGOUT-RESPONSIVE-LOGIN
          path: |
            ${{ env.PC_PROJECT_DIR }}/dist/*.exe
            AniGames-PC-V12.4.4-ADMIN-WINDOWS-CONTROLS-SOURCE.zip
            docs/PC-LOG-OPTIMIZATION-AUDIT.md
            docs/PC-HEARTBEAT-SESSION-PERFORMANCE-AUDIT.md
            docs/PC-SINGLE-INSTANCE-AUDIT-V12.3.7.md
            docs/PC-TIMER-WINDOW-STABILITY-V12.4.0.md
            docs/PC-LOCK-STATE-RECOVERY-V12.4.1.md
            docs/PC-WATCHDOG-AFTER-READY-V12.4.2.md
            ${{ env.PC_PROJECT_DIR }}/EMERGENCY-SHUTDOWN-REMOVAL-AUDIT.md
            ${{ env.PC_PROJECT_DIR }}/ADMIN-LOGOUT-RESPONSIVE-LOGIN-V12.4.5-AUDIT.md
            supabase/migrations/20261101090000_secure_wol_target_mac_resolution.sql
            supabase/migrations/20261028120000_heartbeat_event_write_optimization.sql
            supabase/migrations/20261027120000_free_test_policy_and_server_gate.sql
            supabase/migrations/20261029130000_device_watchdog_restart_billing.sql
            supabase/migrations/20261029140000_offline_restart_command_gate.sql
            supabase/migrations/20261030100000_global_rental_accounts_and_offline_leases.sql
          if-no-files-found: error
          retention-days: 14
