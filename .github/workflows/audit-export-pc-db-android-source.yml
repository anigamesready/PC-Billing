name: Audit Export AniGames PC V12.4.8 DB Android Source

on:
  push:
    branches:
      - pc-billing-v12.4.8-DB-Android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pc:
    name: Patch, regression-check, and build Windows portable EXE
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout V12.4.6 baseline plus V12.4.7 fullscreen safety and V12.4.8 timer-size patch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract source and stage exact patch chain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'AniGames-PC-V12.1.0-ADMIN-POPUP-FIXED-SOURCE.zip'
          if (!(Test-Path $zip)) { throw 'PC source ZIP missing.' }
          Expand-Archive -LiteralPath $zip -DestinationPath 'source-bundle' -Force
          $project = Get-ChildItem 'source-bundle' -Directory -Recurse | Where-Object { $_.Name -eq 'Ani-Games-Billing-PC-V12.1.0' } | Select-Object -First 1
          if (!$project) { throw 'PC project folder missing in source ZIP.' }
          foreach ($required in @('main.js','preload.js','renderer.js','index.html','v11-cloud.js','package.json','package-lock.json')) {
            if (!(Test-Path (Join-Path $project.FullName $required))) { throw "Required PC source file missing: $required" }
          }
          Copy-Item 'scripts/*.py' $project.FullName -Force
          $edgeTarget = Join-Path $project.FullName 'supabase/functions/ani-games-api'
          New-Item -ItemType Directory -Path $edgeTarget -Force | Out-Null
          Copy-Item 'supabase/functions/ani-games-api/index.ts' (Join-Path $edgeTarget 'index.ts') -Force
          Copy-Item 'supabase/functions/ani-games-api/deno.json' (Join-Path $edgeTarget 'deno.json') -Force
          $migrationTarget = Join-Path $project.FullName 'supabase/migrations'
          New-Item -ItemType Directory -Path $migrationTarget -Force | Out-Null
          Get-ChildItem 'supabase/migrations' -File -Filter '*.sql' | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $migrationTarget $_.Name) -Force
          }
          "PC_PROJECT_DIR=$($project.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Source project: $($project.FullName)"

      - name: Apply verified V12.4.5–V12.4.8 patch chain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:PC_PROJECT_DIR
          $patches = @(
            'patch_pc_log_optimization.py',
            'patch_pc_token_preservation.py',
            'patch_pc_live_alert_runtime.py',
            'patch_pc_dual_db_routing.py',
            'patch_pc_shared_gateway.py',
            'patch_pc_v12_2_3_route_refresh.py',
            'patch_pc_v13_shutdown_timer.py',
            'patch_pc_v13_free_test_gate.py',
            'patch_pc_v13_1_heartbeat_performance.py',
            'patch_pc_v13_2_app_exit_protection.py',
            'patch_pc_v13_3_resilience_watchdog.py',
            'patch_pc_v12_3_4_global_rentals.py',
            'patch_pc_v12_3_5_global_rental_gateway.py',
            'patch_pc_v12_3_6_wol_relay.py',
            'patch_pc_v12_3_7_single_instance.py',
            'patch_pc_v12_3_8_auto_wol_mac.py',
            'patch_pc_v12_3_9_kiosk_failsafe.py',
            'patch_pc_v12_4_0_timer_window_stability.py',
            'patch_pc_v12_4_1_lock_state_recovery.py',
            'patch_pc_v12_4_2_watchdog_after_ready.py',
            'patch_pc_v12_4_3_emergency_no_shutdown.py',
            'patch_pc_v12_4_4_restore_direct_windows_shutdown.py',
            'patch_pc_v12_4_5_admin_logout_responsive_login.py',
            'patch_pc_v12_4_6_responsive_display_fit.py',
            'patch_pc_v12_4_7_fullscreen_noninterference.py',
            'patch_pc_v12_4_8_timer_size_sync.py'
          )
          foreach ($patch in $patches) {
            if (!(Test-Path $patch)) { throw "Patch file missing: $patch" }
            Write-Host "Applying $patch"
            python $patch
            if ($LASTEXITCODE -ne 0) { throw "Patch failed: $patch" }
          }

      - name: JavaScript, fullscreen safety, and legacy feature regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:PC_PROJECT_DIR
          foreach ($file in @('main.js','preload.js','renderer.js','v11-cloud.js')) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $file" }
          }
          $main = Get-Content 'main.js' -Raw
          $preload = Get-Content 'preload.js' -Raw
          $index = Get-Content 'index.html' -Raw
          $renderer = Get-Content 'renderer.js' -Raw
          $cloud = Get-Content 'v11-cloud.js' -Raw
          $edge = Get-Content 'supabase/functions/ani-games-api/index.ts' -Raw

          $runtimeMatches = [regex]::Matches($index, '(?s)<script(?:\s[^>]*)?>(.*?)</script>')
          $runtimeMatch = $null
          foreach ($candidate in $runtimeMatches) {
            if ($candidate.Groups[1].Value.Contains('function pauseSession')) { $runtimeMatch = $candidate; break }
          }
          if (!$runtimeMatch) { throw 'Live index.html Billing runtime missing.' }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'index-runtime-check.js'), $runtimeMatch.Groups[1].Value, [System.Text.UTF8Encoding]::new($false))
          node --check index-runtime-check.js
          if ($LASTEXITCODE -ne 0) { throw 'Live index.html JavaScript syntax failed.' }

          $activeStart = $main.IndexOf('function applyActiveTimerWindowMode')
          $activeEnd = $main.IndexOf('function handleBillingDisplayLayoutChange', $activeStart)
          if ($activeStart -lt 0 -or $activeEnd -le $activeStart) { throw 'V12.4.7 active timer mode boundaries missing.' }
          $activeBody = $main.Substring($activeStart, $activeEnd - $activeStart)
          if (!$activeBody.Contains('setAlwaysOnTop(false)') -or !$activeBody.Contains('showInactive')) { throw 'Active Billing timer is not non-topmost/non-activating.' }
          if ($activeBody.Contains('setAlwaysOnTop(true') -or $activeBody.Contains('.focus()') -or $activeBody.Contains('.restore()')) { throw 'Active Billing timer can still cover or activate a fullscreen game.' }

          $recoveryStart = $main.IndexOf('function releaseDesktopLock')
          $recoveryEnd = $main.IndexOf('function armRendererReadyTimeout', $recoveryStart)
          if ($recoveryStart -lt 0 -or $recoveryEnd -le $recoveryStart) { throw 'V12.4.7 recovery boundaries missing.' }
          $recoveryBody = $main.Substring($recoveryStart, $recoveryEnd - $recoveryStart)
          if (!$recoveryBody.Contains('showInactive') -or $recoveryBody.Contains('.focus()') -or $recoveryBody.Contains('.restore()')) { throw 'Renderer recovery can still steal focus.' }

          $scheduleStart = $main.IndexOf('function scheduleRendererRecovery')
          $scheduleEnd = $main.IndexOf('function emergencyUnlockDesktop', $scheduleStart)
          if ($scheduleStart -lt 0 -or $scheduleEnd -le $scheduleStart) { throw 'V12.4.7 recovery scheduler boundaries missing.' }
          $scheduleBody = $main.Substring($scheduleStart, $scheduleEnd - $scheduleStart)
          if (!$scheduleBody.Contains('deferredRendererRecovery=') -or !$scheduleBody.Contains('!w.isFocused()')) { throw 'Background renderer recovery is not deferred.' }
          foreach ($token in @("protectedWindow.on('blur'", "protectedWindow.on('focus'", 'pendingTimerWindowGeometrySync', 'billingInitialLoadFinished', 'billingInitialReadyCompleted', 'billingHasForegroundFocus')) {
            if (!$main.Contains($token)) { throw "V12.4.7 focus-safety token missing: $token" }
          }
          if ($main.Contains("w.setAlwaysOnTop(true,'floating')")) { throw 'Legacy always-on-top timer mode remains.' }
          $timerResizeStart = $main.IndexOf("ipcMain.on('resize-timer-window'")
          $timerResizeEnd = $main.IndexOf("ipcMain.on('minimize-timer-window'", $timerResizeStart)
          if ($timerResizeStart -lt 0 -or $timerResizeEnd -le $timerResizeStart) { throw 'V12.4.8 timer resize IPC boundaries missing.' }
          $timerResizeBody = $main.Substring($timerResizeStart, $timerResizeEnd - $timerResizeStart)
          if (!$timerResizeBody.Contains('rememberPendingTimerWindowGeometry(width,height)') -or !$timerResizeBody.Contains('!timerWindowModeActive||!mainWindow.isFocused()')) { throw 'V12.4.8 exact requested dimensions are not retained while unfocused.' }
          if (!$main.Contains('let pendingTimerWindowGeometry = null;') -or !$main.Contains('function rememberPendingTimerWindowGeometry(') -or !$main.Contains('function flushPendingTimerWindowGeometry(')) { throw 'V12.4.8 deferred timer geometry state/helpers missing.' }
          if (!$main.Contains('flushPendingTimerWindowGeometry(protectedWindow)')) { throw 'V12.4.8 focus handler does not flush requested timer size.' }
          foreach ($token in @('width: 500px;', 'height: 76px;', '#timer-widget.compact', 'width: 220px;', 'height: 54px;')) {
            if (!$index.Contains($token)) { throw "Timer full/compact CSS dimension missing: $token" }
          }
          if ($main.Contains("popup.setAlwaysOnTop(true, 'floating')") -or $main.Contains('popup.focus();')) { throw 'Admin message popup can still cover/focus a fullscreen game.' }
          if ($main.Contains('if (!billingUiReady) { mainWindow.show(); mainWindow.focus(); }')) { throw 'Every renderer reload still activates Billing.' }

          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $lock = Get-Content 'package-lock.json' -Raw | ConvertFrom-Json -AsHashtable
          if ($package.version -ne '12.4.8' -or $lock.version -ne '12.4.8') { throw 'PC version is not V12.4.8.' }
          if ($package.build.appId -ne 'com.anigames.billing.v12test' -or $package.build.productName -ne 'AniGames Billing V12.3.3') { throw 'Persistent Electron app identity changed.' }
          if (!$index.Contains('V12.4.8-TIMER-SIZE-SYNC') -or !$renderer.Contains('V12.4.8-TIMER-SIZE-SYNC')) { throw 'V12.4.8 version markers missing.' }

          foreach ($token in @("ipcMain.handle('hide-billing'", "ipcMain.handle('show-billing'", "const powerCommands = { logoff: ['/l'], restart: ['/r', '/t', '0'], shutdown: ['/s', '/t', '0'] }", "app.requestSingleInstanceLock({", "globalShortcut.register('Control+Alt+F12'")) {
            if (!$main.Contains($token)) { throw "Existing Windows/Admin feature missing: $token" }
          }
          foreach ($token in @('hideBilling: () => ipcRenderer.invoke', 'showBilling: () => ipcRenderer.invoke')) {
            if (!$preload.Contains($token)) { throw "Admin Logout/Login bridge missing: $token" }
          }
          foreach ($token in @('ani_games_billing_ui_state', 'fitLoginBoxToViewport', 'window.v11ApplyRemoteCommand = async')) {
            if (!$index.Contains($token)) { throw "Existing Login/command feature missing: $token" }
          }
          if (!$cloud.Contains('billingUiState:String(localStorage.getItem')) { throw 'Billing UI state heartbeat missing.' }
          foreach ($token in @('device_rental_lookup', 'device_start_rental_session', 'device_end_rental_session')) {
            if (!$edge.Contains($token)) { throw "Shared rental API regression: $token" }
          }
          foreach ($token in @("ipcMain.handle('wake-on-lan'", "get-wol-network-info")) {
            if (!$main.Contains($token)) { throw "Wake-on-LAN main IPC regression: $token" }
          }
          if ($index.Contains('function v12CheckScheduledShutdown()') -or $index.Contains('function v12ShutdownScheduleFromAdmin(')) {
            throw 'Automatic shutdown countdown was unintentionally reintroduced.'
          }
          foreach ($token in @('ANI_GAMES_V12_4_3_PURGE_LEGACY_SHUTDOWN_TIMER', 'SHUTDOWN_TIMER_DISABLED')) {
            if (!$index.Contains($token)) { throw "Shutdown timer removal guard missing: $token" }
          }
          Get-ChildItem -Path 'patch_pc_*.py' -File | ForEach-Object {
            python -m py_compile $_.Name
            if ($LASTEXITCODE -ne 0) { throw "Python patch syntax failed: $($_.Name)" }
          }
          Remove-Item 'index-runtime-check.js' -Force
          Write-Host 'PASS: V12.4.8 exact timer sizing, V12.4.7 fullscreen non-interference, responsive display, Admin controls, rental/session, pairing, WOL, and shutdown policy.'

      - name: Package exact patched V12.4.8 source for DB Android audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path $env:PC_PROJECT_DIR).Path
          @'
          import os, zipfile
          from pathlib import Path
          root=Path(os.environ["PC_PROJECT_DIR"]).resolve()
          output=Path("AniGames-PC-V12.4.8-DB-Android-SOURCE.zip")
          excluded={"node_modules","dist",".git",".cache","__pycache__"}
          with zipfile.ZipFile(output,"w",zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for item in root.rglob("*"):
                  if not item.is_file() or any(part in excluded for part in item.relative_to(root).parts):
                      continue
                  z.write(item,(Path(root.name)/item.relative_to(root)).as_posix())
          print("Patched source archive:",output,output.stat().st_size)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'PC source packaging failed.' }

      - name: Upload patched PC source for DB Android audit
        uses: actions/upload-artifact@v4
        with:
          name: AniGames-PC-V12.4.8-DB-Android-source-audit
          path: AniGames-PC-V12.4.8-DB-Android-SOURCE.zip
          if-no-files-found: error
          retention-days: 14
