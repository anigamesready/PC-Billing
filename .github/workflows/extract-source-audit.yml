name: Build guarded PC Billing dual-DB routing source

on:
  push:
    branches:
      - main
      - feature/dual-db-runtime-routing-v1
    paths:
      - 'AniGames-PC-V12.1.0-ADMIN-POPUP-FIXED-SOURCE.zip'
      - '.github/workflows/extract-source-audit.yml'
      - 'scripts/patch_pc_dual_db_routing.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inventory source
        shell: bash
        run: |
          set -euo pipefail
          ZIP='AniGames-PC-V12.1.0-ADMIN-POPUP-FIXED-SOURCE.zip'
          test -s "$ZIP"
          mkdir -p pc-source
          unzip -q "$ZIP" -d pc-source
          python3 scripts/patch_pc_dual_db_routing.py pc-source
          CLOUD_JS="$(find pc-source -type f -name v11-cloud.js -print -quit)"
          test -n "$CLOUD_JS"
          PROJECT_DIR="$(dirname "$CLOUD_JS")"
          echo "PC_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          node --check "$CLOUD_JS"
          grep -q 'data_parity_ready' "$CLOUD_JS"
          grep -q 'TOKEN TIDAK DITEMUKAN PADA DB AKTIF' "$CLOUD_JS"
          (cd pc-source && zip -qr "$GITHUB_WORKSPACE/AniGames-PC-V12.2.0-DUAL-DB-ROUTING-SOURCE.zip" .)
          find pc-source -type d \( -name node_modules -o -name .git -o -name dist -o -name build \) -prune -o -type f -print | sort > pc-source-files.txt
          {
            echo '# PC Billing source audit inventory'
            echo
            echo "Source ZIP: $ZIP"
            echo "ZIP bytes: $(wc -c < "$ZIP")"
            echo "Extracted files: $(wc -l < pc-source-files.txt)"
            echo
            echo '## Project manifests'
            find pc-source -type f \( -name package.json -o -name package-lock.json -o -name '*.yml' -o -name '*.yaml' \) -not -path '*/node_modules/*' -print
            echo
            echo '## Logging, event, sync, notification, and timer references'
            grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=build 'console\.(log|info|warn|error|debug)|logger\.|audit_logs|usage_events|device_events|heartbeat|setInterval|setTimeout|usage_exceeded|notification|notify|show_admin_message|rental.*(end|stop|expire|habis|berakhir)|console\.clear' pc-source || true
          } > pc-billing-audit.txt
          zip -qr pc-source-unpacked.zip pc-source pc-source-files.txt
          echo 'Source extracted and audit inventory generated.'
      - name: Set up Node.js for Electron
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ env.PC_PROJECT_DIR }}/package-lock.json
      - name: Build Windows portable PC Billing executable
        shell: bash
        run: |
          set -euo pipefail
          cd "$PC_PROJECT_DIR"
          npm ci
          npm run build
          test -n "$(find dist -maxdepth 2 -type f -name '*.exe' -print -quit)"
          ls -lh dist/*.exe
      - name: Upload extracted source and audit report
        uses: actions/upload-artifact@v4
        with:
          name: AniGames-PC-V12.2.0-DUAL-DB-ROUTING-SOURCE
          path: |
            pc-source-unpacked.zip
            pc-billing-audit.txt
            AniGames-PC-V12.2.0-DUAL-DB-ROUTING-SOURCE.zip
            ${{ env.PC_PROJECT_DIR }}/dist/*.exe
          if-no-files-found: error
          retention-days: 7
