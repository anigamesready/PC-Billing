name: Test DB Android PC Core on PostgreSQL

on:
  push:
    branches:
      - backend/db-android-core-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-smoke:
    name: Fresh PostgreSQL schema and DB Android API regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ani_games_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ani_games_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout isolated DB Android core branch
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply local staging schema, API functions and least-privilege grants
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/schema/000_prerequisites.sql
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/schema/002_core_business_schema.sql
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/schema/003_pc_device_api_functions.sql
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/schema/004_billing_reseller_api.sql
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/schema/005_runtime_privileges.sql
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/schema/006_admin_local_auth_and_rpc.sql
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/schema/007_billing_control_commands.sql
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/schema/008_local_business_triggers.sql
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/schema/009_admin_db1_business_routines.sql
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/schema/010_billing_reseller_refresh_and_devices.sql

      - name: Run PC pairing, heartbeat, rental, lease, sync and shutdown safety regressions
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/tests/001_pc_device_api_smoke.sql

      - name: Run Billing and Reseller authentication, tenant-isolation and CRUD regressions
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/tests/002_billing_reseller_api_smoke.sql

      - name: Verify API role cannot directly access business tables
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/tests/003_runtime_privileges_smoke.sql

      - name: Run local Admin authentication and RPC compatibility regressions
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/tests/004_admin_local_auth_smoke.sql

      - name: Run Admin device, activity, trial and policy regressions
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/tests/007_admin_device_policy_smoke.sql

      - name: Run remaining Admin UI RPC and report regressions
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/tests/008_admin_enrollment_reports_theme_smoke.sql

      - name: Run Admin reseller workspace and Billing Control account CRUD regressions
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/tests/009_admin_billing_user_crud_smoke.sql

      - name: Verify Reseller refresh token and device/session APIs
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/tests/010_billing_refresh_smoke.sql

      - name: Run Billing Control command authorization regressions
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/tests/005_billing_control_commands_smoke.sql

      - name: Verify local rental identity and audit triggers
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 -f db-android-core/tests/006_local_business_triggers_smoke.sql

      - name: Syntax-check isolated Termux staging scripts without executing them
        run: |
          set -euo pipefail
          bash -n db-android-core/setup-stage.sh
          bash -n db-android-core/start-stage.sh
          bash -n db-android-core/status-stage.sh
          bash -n db-android-core/stop-stage.sh
          bash -n db-android-core/server/migrate-local.sh
          bash -n db-android-core/server/provision-runtime-role.sh
          bash -n db-android-core/server/install-deps.sh
          bash -n db-android-core/server/start.sh

      - name: Verify logical backup and restore on a separate staging database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          pg_dump -X -h 127.0.0.1 -p 5432 -U postgres -Fc -d ani_games_test -f /tmp/ani-games-ready-ci.backup
          createdb -h 127.0.0.1 -p 5432 -U postgres ani_games_restore_test
          pg_restore -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_restore_test --no-owner /tmp/ani-games-ready-ci.backup
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" > /tmp/original-table-count
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_restore_test -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" > /tmp/restored-table-count
          diff -u /tmp/original-table-count /tmp/restored-table-count
          for table in organizations devices device_tokens rental_accounts rental_sessions rental_offline_leases usage_events audit_logs billing_control_accounts billing_control_sessions; do
            original=$(psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -Atqc "SELECT count(*) FROM public.$table")
            restored=$(psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_restore_test -Atqc "SELECT count(*) FROM public.$table")
            test "$original" = "$restored" || { echo "Restore row-count mismatch: $table"; exit 1; }
          done
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_restore_test -Atqc "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='api'" > /tmp/restored-api-functions
          test "$(cat /tmp/restored-api-functions)" -gt 40
          sha256sum /tmp/ani-games-ready-ci.backup
          echo "PASS: logical backup restored into ani_games_restore_test; table and critical-row counts match."

      - name: Install Node.js and verify local API syntax
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install local API dependency and syntax-check server
        working-directory: db-android-core/server
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check

      - name: Test local API over HTTP using the restricted database role
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d ani_games_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ani_api_login LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'ci-api-password';
          GRANT ani_api_runtime TO ani_api_login;
          INSERT INTO public.device_enrollments(org_id,code_hash,label,expires_at)
          SELECT org_id,encode(extensions.digest('CI-API-PAIR','sha256'),'hex'),'CI API enrollment',now()+interval '15 minutes'
          FROM public.billing_control_accounts WHERE username='CI-RESELLER-LOGIN';
          SQL
          export DATABASE_URL='postgresql://ani_api_login:ci-api-password@127.0.0.1:5432/ani_games_test?sslmode=disable'
          export ANI_BIND=127.0.0.1
          export PORT=8787
          export ANI_API_PEPPER='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          export ANI_ADMIN_BOOTSTRAP_TOKEN=''
          node db-android-core/server/server.mjs >/tmp/ani-local-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/tmp/ani-health.json; then break; fi
            sleep 1
          done
          node db-android-core/server/api-smoke.mjs
          node db-android-core/server/api-smoke-billing-refresh.mjs
          node db-android-core/server/api-smoke-login-lookup.mjs
