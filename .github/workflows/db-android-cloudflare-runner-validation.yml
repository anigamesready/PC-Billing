name: DB Android Cloudflare Runner Validation

on:
  push:
    branches:
      - infra/db-android-cloudflare-global-stage-20261116
    paths:
      - "db-android-core/cloudflare-gateway-stage/*.sh"
      - "db-android-core/cloudflare-gateway-stage/*.py"
      - ".github/workflows/db-android-cloudflare-runner-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated DB Android branch
        uses: actions/checkout@v4
        with:
          ref: infra/db-android-cloudflare-global-stage-20261116
      - name: Validate Termux shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n db-android-core/cloudflare-gateway-stage/start-online.sh
          bash -n db-android-core/cloudflare-gateway-stage/start-online-proot.sh
          bash -n db-android-core/cloudflare-gateway-stage/setup-proot-cloudflared.sh
          bash -n db-android-core/stop-stage.sh
          echo "PASS: all changed shell scripts parse."
      - name: Check runner safety anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ANI_BIND' db-android-core/cloudflare-gateway-stage/patch_server_edge_proxy.py
          grep -Fq '127.0.0.1' db-android-core/cloudflare-gateway-stage/patch_server_edge_proxy.py
          ! grep -Eq '0\.0\.0\.0' db-android-core/cloudflare-gateway-stage/patch_server_edge_proxy.py
          grep -Fq 'API local dan port 8787 tidak disentuh' db-android-core/cloudflare-gateway-stage/start-online.sh
          grep -Fq 'proot-distro kill "$PROOT_CONTAINER"' db-android-core/cloudflare-gateway-stage/start-online.sh
          python3 - <<'PY'
          from pathlib import Path
          source = Path("db-android-core/cloudflare-gateway-stage/start-online.sh").read_text()
          helper = source.split("stop_tunnel() {", 1)[1].split("\\n}", 1)[0]
          assert not any(line.strip() == "stop_tunnel" for line in helper.splitlines()), "recursive cleanup call detected"
          assert 'proot-distro kill "$PROOT_CONTAINER"' in helper, "dedicated PRoot cleanup missing"
          print("PASS: cleanup helper is non-recursive and stops only its dedicated container.")
          PY
          echo "PASS: loopback, port isolation and cleanup safety anchors verified."
